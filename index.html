          <h3 data-i18n="dtTitle">Digital Tickets</h3>
         <p class="project1-desc2" data-i18n="dtDesc2">
            Identified a manual process that needed automation. Breakfast and lunch purchases were recorded manually, causing delays and making information difficult to access.
            A web application was developed using an employee ID card and scanner to record each purchase. The system automatically stores the information and adds each purchase to the employee's account.
            This solution made the process faster, improved record accuracy, and allowed the staff involved to access and review information more easily.
          </p>
          <div class="project-screenshots">
            <img src="img/Tikect1.PNG" alt="screenshot 1" />
          </div>
          <li data-i18n="dtLi1">
              This application uses PostgreSQL as database and employs JWT based authentication for role based access control (RBAC). 
              Test automation was implemented using Jest, and the application was deployed to the cloud via Microsoft Azure, 
              utilizing CI/CD pipelines and GitHub Actions.
          </li>
          <div class="project-links"></div>
          <div class="project-tags">
            <span>React</span>

<!-- //Bitacora Digital -->
        <div class="project-card">
          <h3 data-i18n="lbTitle">Digital logBook</h3>
              <p class="project1-desc2" data-i18n="lbDesc2">
            ### Employee Leave & Permission Management System
We identified a slow, manual process for reviewing employee requests, including vacations, medical leave, days off, and other permissions. The information was not centralized, making it difficult to review requests and causing delays across several departments.
We developed a web application where each supervisor can submit requests for their employees and attach the required documents. The requests are then reviewed by Human Resources and Management.
This automation made the process faster for supervisors, centralized employee information, and simplified the review process for everyone involved.
          </p>
          <div class="project-screenshots">
            <img src="img/bitacora1.PNG" alt="screenshot 1" />
          </div>

            <li data-i18n="lbLi1">
              **Technologies & Implementation**
Implemented JWT authentication and Role Based Access Control (RBAC) to manage user access and permissions. Developed RESTful APIs to manage employee 
requests and implemented automated testing using Jest and Selenium. The application was initially deployed on Railway and later migrated to Microsoft Azure.
            </li>
